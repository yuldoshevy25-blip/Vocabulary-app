<style>
  :root{
    --paper:#F1E9D6; --paper-dark:#E4D8BE;
    --ink:#183430; --ink-soft:#3E5C55;
    --brass:#B0842A; --brass-dark:#8C6A1E;
    --wrong:#A23E2F; --right:#2F6E52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(circle at 20% 10%, rgba(176,132,42,0.06), transparent 40%), var(--paper);
    font-family:'Inter',sans-serif; color:var(--ink);

  .header{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}

  .mode-btn{background:none;border:1.5px solid var(--ink);color:var(--ink);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;border-radius:20px;cursor:pointer;}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--paper-dark);border-radius:6px;box-shadow:0 2px 0 var(--paper-dark),0 10px 26px -14px rgba(24,52,48,0.35);padding:28px 22px;position:relative;overflow:hidden;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .term{font-family:'Fraunces',serif;font-size:32px;font-weight:600;line-height:1.15;margin:4px 0 20px;min-height:40px;}
  .translit{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);margin-top:-14px;margin-bottom:20px;}
  input[type=text],input[type=email],input[type=password]{width:100%;font-family:'Space Mono',monospace;font-size:16px;padding:14px;border:1.5px solid var(--paper-dark);border-radius:4px;background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px;}
  input:focus{border-color:var(--brass);}
  .row{display:flex;gap:10px;margin-top:10px;}
  button.primary{flex:1;background:var(--ink);color:var(--paper);border:none;padding:14px;border-radius:4px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  button.primary:disabled{opacity:0.4;}
  button.ghost{background:none;border:1.5px solid var(--ink-soft);color:var(--ink-soft);padding:14px 16px;border-radius:4px;font-size:15px;cursor:pointer;}
  .feedback{margin-top:14px;font-family:'Space Mono',monospace;font-size:14px;min-height:18px;}
  .feedback.right{color:var(--right);}
  .feedback.wrong{color:var(--wrong);}
  .stamp{position:absolute;top:18px;right:18px;width:60px;height:60px;border:3px solid var(--right);border-radius:50%;color:var(--right);font-family:'Space Mono',monospace;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-14deg) scale(0);transition:transform 0.25s ease;pointer-events:none;}
  .stamp.show{transform:rotate(-14deg) scale(1);}
  .msg{text-align:center;color:var(--ink-soft);font-size:14px;padding:20px 6px;}
  .stagepill{display:inline-block;background:var(--paper);border:1px solid var(--paper-dark);border-radius:14px;padding:4px 12px;font-family:'Space Mono',monospace;font-size:12px;margin-bottom:14px;}
  .studentrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--paper-dark);font-size:13px;}
  .wordrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--paper-dark);font-size:13px;}
  .del{color:var(--wrong);background:none;border:none;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;}
  label.f{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 4px;}
  label.f:first-child{margin-top:0;}
  .answerDisplay{width:100%;min-height:48px;border:1.5px solid var(--paper-dark);border-radius:4px;background:var(--paper);padding:12px;font-family:'Space Mono',monospace;font-size:17px;margin-bottom:12px;letter-spacing:1px;word-break:break-all;}
  .keyboard{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .krow{display:flex;gap:4px;justify-content:center;}
  .key{flex:1;max-width:42px;padding:16px 0;background:var(--ink);color:var(--paper);border:none;border-radius:6px;font-family:'Space Mono',monospace;font-size:16px;font-weight:700;}

</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAv97Eiunq_meE4vB3sBVovV5fsB7ae9z4",
  authDomain: "vocabulary-app-f6115.firebaseapp.com",
  projectId: "vocabulary-app-f6115",
  storageBucket: "vocabulary-app-f6115.firebasestorage.app",

  appId: "1:219360699668:web:f89134da06103f7dc2ce01"
};
const ADMIN_EMAIL = "admin@lugat.com";
const SESSION_SECONDS = 8 * 60;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const app = document.getElementById('app');
const signOutBtn = document.getElementById('signOutBtn');
let studentData = null;
let words = [], queue = [], current = null, score = {right:0,total:0};
let sessionEndTime = null, timeLeft = SESSION_SECONDS, timerInterval = null;
let typedAnswer = '';
let results = [];

function todayStr(){ return new Date().toISOString().slice(0,10); }
function tomorrowStr(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function formatTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }
  function transliterate(str){
  const map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya',ғ:'gh',қ:'q',ҳ:'h',ҷ:'j',ӣ:'i',ӯ:'u'};
  return str.toLowerCase().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
}
function nameToEmail(fullName){
  let slug = transliterate(fullName.trim())
    .replace(/[^a-z0-9]+/g, '.')
    .replace(/^\.+|\.+$/g, '');
  if(!slug) slug = 'user' + Date.now();
  return slug + '@lugat.local';
  }

/* ---------- AUTH (только вход, регистрацию делает админ) ---------- */
function renderAuth(){
  signOutBtn.style.display = 'none';
  app.innerHTML = `
    <div class="card">

      <label class="f">Имя и Фамилия</label>

function doLogin(){

  const pass = document.getElementById('authPass').value;
  const fb = document.getElementById('authFeedback');
  fb.textContent = ''; fb.className='feedback';
  if(!email || !pass){ fb.textContent="Введите email и пароль"; fb.className='feedback wrong'; return; }
  const loginEmail = email.includes('@') ? email : nameToEmail(email);
  auth.signInWithEmailAndPassword(loginEmail, pass)
    .catch(err => { fb.textContent = err.message; fb.className='feedback wrong'; });
}

/* ---------- STUDENT HOME ---------- */
function loadStudentAndRenderHome(uid){
  db.collection('students').doc(uid).get().then(doc => {
    studentData = doc.data();
    renderStudentHome();
  });
}

function renderStudentHome(){
  signOutBtn.style.display = 'inline-block';
  const locked = studentData.nextAvailable && studentData.nextAvailable > todayStr();
  const lastHist = studentData.history && studentData.history.length
    ? studentData.history[studentData.history.length-1] : null;

  app.innerHTML = `
    <div class="card">
      <div class="stagepill">Этап ${studentData.stage}</div>
      <div class="term" style="font-size:24px;">Готовы к тесту?</div>
      ${lastHist ? `<div class="msg" style="text-align:left;padding:0 0 14px;">Последняя попытка: ${lastHist.date} — ${lastHist.correct}/${lastHist.total} правильно</div>` : ''}
      ${locked ? `<div class="msg">Следующая попытка откроется <b>${studentData.nextAvailable}</b>.</div>` :
        `<button class="primary" id="startBtn" style="width:100%;">Начать тест</button>`}
    </div>
  `;
  if(!locked){
    document.getElementById('startBtn').onclick = () => startTestSession(studentData.stage);
  }
}

/* ---------- TEST SESSION ---------- */
function startTestSession(stageNum){
  db.collection('stages').doc(String(stageNum)).get().then(doc => {
    const data = doc.data();
    words = (data && data.words) ? data.words : [];
    if(words.length === 0){
      app.innerHTML = `<div class="card"><div class="msg">Для этого этапа ещё нет слов. Обратитесь к администратору.</div>
        <button class="ghost" id="backBtn" style="width:100%;margin-top:10px;">Назад</button></div>`;
      document.getElementById('backBtn').onclick = renderStudentHome;
      return;
    }
    score = {right:0, total:0};
    results = [];
    current = null;
    queue = shuffle(words);
    sessionEndTime = Date.now() + SESSION_SECONDS * 1000;
    timeLeft = SESSION_SECONDS;
    clearInterval(timerInterval);
    timerInterval = setInterval(tick, 500);
    renderQuiz();
  });
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function tick(){
  const remaining = Math.round((sessionEndTime - Date.now()) / 1000);
  if(remaining <= 0){
    timeLeft = 0;
    clearInterval(timerInterval);
    finishSession();
    return;
  }
  timeLeft = remaining;
  const el = document.getElementById('timerDisplay');
  if(el) el.textContent = formatTime(timeLeft);
}

/* ---------- ON-SCREEN QWERTY KEYBOARD ---------- */
function buildKeyboardHTML(){
  const rows = ['qwertyuiop','asdfghjkl','zxcvbnm-\''];
  let html = '<div class="keyboard">';
  rows.forEach(row => {
    html += '<div class="krow">';
    row.split('').forEach(ch => {
      html += `<button type="button" class="key" data-k="${ch}">${ch}</button>`;
    });
    html += '</div>';
  });
  html += `<div class="krow">
    <button type="button" class="key space" id="keySpace">space</button>
    <button type="button" class="key back" id="keyBack">⌫</button>
  </div></div>`;
  return html;
}
function updateAnswerDisplay(){
  const el = document.getElementById('answerDisplay');
  if(el) el.textContent = typedAnswer.length ? typedAnswer : '\u00A0';
}
function attachKeyboardHandlers(){
  document.querySelectorAll('.key[data-k]').forEach(btn => {
    btn.onclick = () => { typedAnswer += btn.dataset.k; updateAnswerDisplay(); };
  });
  document.getElementById('keySpace').onclick = () => { typedAnswer += ' '; updateAnswerDisplay(); };
  document.getElementById('keyBack').onclick = () => { typedAnswer = typedAnswer.slice(0,-1); updateAnswerDisplay(); };
}

function renderQuiz(){
  signOutBtn.style.display = 'none';
  if(!current){
    if(queue.length === 0){ finishSession(); return; }
    current = queue.pop();
  }
  typedAnswer = '';
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow" style="display:flex;justify-content:space-between;">
        <span>${score.total+1} / ${words.length}</span>
        <span id="timerDisplay" style="color:var(--brass-dark);font-weight:700;">${formatTime(timeLeft)}</span>
      </div>
      <div class="term">${current.term}</div>
      ${current.term2 ? `<div class="translit">${current.term2}</div>` : ''}
      <div class="answerDisplay" id="answerDisplay">&nbsp;</div>
      ${buildKeyboardHTML()}
      <div class="row">
        <div class="row">
        <button class="ghost" id="nextBtn">Пропустить</button>
        <button class="primary" id="checkBtn">Проверить</button>
      </div>
    </div>
  `;
  attachKeyboardHandlers();
  document.getElementById('checkBtn').onclick = checkAnswer;
  document.getElementById('nextBtn').onclick = skipWord;
}

function checkAnswer(){
  const val = normalize(typedAnswer);
  const correctAnswers = current.answer.split('/').map(normalize);
  const isCorrect = correctAnswers.includes(val) && val !== '';
  results.push({term: current.term, term2: current.term2, userAnswer: typedAnswer, correctAnswer: current.answer, isCorrect});
  score.total++;
  if(isCorrect) score.right++;
  nextWord();
}
function skipWord(){
  results.push({term: current.term, term2: current.term2, userAnswer: '', correctAnswer: current.answer, isCorrect: false});
  score.total++;
  nextWord();
}
function nextWord(){
  if(queue.length === 0){ clearInterval(timerInterval); finishSession(); }
  else { current = null; renderQuiz(); }
}

function finishSession(){
  clearInterval(timerInterval);
  const correct = score.right, total = words.length;
  let newStage = studentData.stage, nextAvail = null;
  if(correct <= 39){ nextAvail = tomorrowStr(); }
  else if(correct <= 47){ newStage = studentData.stage + 1; nextAvail = tomorrowStr(); }
  else { newStage = studentData.stage + 1; nextAvail = null; }

  const entry = {date: todayStr(), stage: studentData.stage, correct, total};
  const uid = auth.currentUser.uid;
  const newHistory = (studentData.history || []).concat([entry]);

  db.collection('students').doc(uid).update({
    stage: newStage, nextAvailable: nextAvail, history: newHistory
  }).then(() => {
    studentData.stage = newStage;
    studentData.nextAvailable = nextAvail;
    studentData.history = newHistory;
    renderResult(correct, total, newStage, nextAvail);
  });
}

function renderResult(correct, total, newStage, nextAvail){
  signOutBtn.style.display = 'inline-block';
  let statusMsg;
  if(correct <= 39) statusMsg = "Меньше 40 — завтра пересдача этого этапа.";
  else if(correct <= 47) statusMsg = `Вы перешли на следующий этап, но начнёте ${nextAvail}.`;
  else statusMsg = "Отличный результат! Вы сразу перешли на следующий этап.";

  const rows = results.map(r => `
    <div class="wordrow">
      <span>${r.term}${r.term2?' / '+r.term2:''} — ваш ответ: <b style="color:${r.isCorrect?'var(--right)':'var(--wrong)'}">${r.userAnswer || '—'}</b>${r.isCorrect?'':` (правильно: ${r.correctAnswer})`}</span>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">Результат</div>
      <div class="term" style="font-size:26px;">${correct} / ${total} правильно</div>
      <div class="msg" style="text-align:left;padding:0 0 14px;">${statusMsg}</div>
    </div>
    <div class="card" style="margin-top:16px;max-height:400px;overflow-y:auto;">
      <div class="eyebrow">Подробности</div>
      ${rows}
    </div>
    <div style="width:100%;max-width:420px;margin-top:16px;">
      <button class="primary" id="homeBtn" style="width:100%;">Перейти на главную</button>
    </div>
  `;
  document.getElementById('homeBtn').onclick = renderStudentHome;
}

/* Создаём ученика через отдельный (второй) экземпляр Firebase,
   чтобы не выйти из аккаунта админа */
function createStudentAccount(){
  const fullName = document.getElementById('newEmail').value.trim();
    const email = nameToEmail(fullName);
    const pass = document.getElementById('newPass').value;
  const fb = document.getElementById('createFeedback');
  fb.textContent = ''; fb.className = 'feedback';
  if(!email || !pass){ fb.textContent = "Введите email и пароль"; fb.className='feedback wrong'; return; }

  let secondaryApp;
  try{
    secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary_" + Date.now());
  }catch(e){
    fb.textContent = "Ошибка инициализации"; fb.className='feedback wrong'; return;
  }
  const secondaryAuth = secondaryApp.auth();

  secondaryAuth.createUserWithEmailAndPassword(email, pass)
    .then(cred => {
      return db.collection('students').doc(cred.user.uid).set({
        email: email, fullName: fullName, stage: 1, nextAvailable: null, history: []
      });
    })
    .then(() => {
      fb.textContent = "Ученик создан!"; fb.className='feedback right';
      document.getElementById('newEmail').value = '';
      document.getElementById('newPass').value = '';
      loadStudentList();
    })
    .catch(err => {
      fb.textContent = err.message; fb.className='feedback wrong';
    })
    .finally(() => {
      secondaryAuth.signOut().then(() => secondaryApp.delete());
    });
}
function copyStage(){
  const from = document.getElementById('copyFrom').value.trim();
  const to = document.getElementById('copyTo').value.trim();
  const fb = document.getElementById('copyFeedback');
  if(!from || !to){ fb.textContent = "Укажите оба номера"; fb.className='feedback wrong'; return; }
  db.collection('stages').doc(from).get().then(doc => {
    if(!doc.exists || !doc.data().words){
      fb.textContent = "Исходный этап пуст или не найден"; fb.className='feedback wrong'; return;
    }
    return db.collection('stages').doc(to).set({words: doc.data().words}, {merge:true});
  }).then(() => {
    fb.textContent = "Перенесено!"; fb.className='feedback right';
  }).catch(err => {
    fb.textContent = err.message; fb.className='feedback wrong';
  });
}
  function bulkAddWords(){
  const stageNum = document.getElementById('stageNum').value.trim();
  const raw = document.getElementById('bulkText').value;
  const fb = document.getElementById('bulkFeedback');
  if(!stageNum){ fb.textContent="Укажите номер этапа"; fb.className='feedback wrong'; return; }
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0){ fb.textContent="Список пуст"; fb.className='feedback wrong'; return; }
  const newWords = lines.map(line => {
    const parts = line.split('|').map(p => p.trim());
    if(parts.length >= 3){
      return {term: parts[0], term2: parts[1], answer: parts[2]};
    } else {
      return {term: parts[0], term2: '', answer: parts[1] || ''};
    }
  }).filter(w => w.term && w.answer);

  if(newWords.length === 0){ fb.textContent="Не удалось распознать слова"; fb.className='feedback wrong'; return; }

  db.collection('stages').doc(stageNum).set({
    words: firebase.firestore.FieldValue.arrayUnion(...newWords)
  }, {merge: true}).then(() => {
    fb.textContent = `Добавлено слов: ${newWords.length}`; fb.className='feedback right';
    document.getElementById('bulkText').value = '';
    loadStageWords();
  }).catch(err => {
    fb.textContent = err.message; fb.className='feedback wrong';
  });
  }
function loadStudentList(){
  db.collection('students').get().then(snap => {
    if(snap.empty){
      document.getElementById('studentList').innerHTML = "Пока нет учеников.";
      return;
    }
    let rows = '';
    snap.forEach(doc => {
      const d = doc.data();
      const last = d.history && d.history.length ? d.history[d.history.length-1] : null;
      rows += `<div class="studentrow">
        <span>${d.email}<br>Этап ${d.stage}${last ? ` — последний: ${last.correct}/${last.total} (${last.date})` : ''}</span>
      </div>`;
    });
    document.getElementById('studentList').innerHTML = rows;
  });
}

/* Безопасное добавление слова — arrayUnion не перезаписывает список */
function addWord(){
  const stageNum = document.getElementById('stageNum').value.trim();
  const term = document.getElementById('fTerm').value.trim();
  const term2 = document.getElementById('fTerm2').value.trim();
  const answer = document.getElementById('fAnswer').value.trim();
  const fb = document.getElementById('addFeedback');
  if(!stageNum || !term || !answer){ fb.textContent="Заполните этап, слово и ответ"; fb.className='feedback wrong'; return; }

  const newWord = {term, term2, answer};
  db.collection('stages').doc(stageNum).set({
    words: firebase.firestore.FieldValue.arrayUnion(newWord)
  }, {merge: true}).then(() => {
    fb.textContent = "Добавлено!"; fb.className='feedback right';
    document.getElementById('fTerm').value='';
    document.getElementById('fTerm2').value='';
    document.getElementById('fAnswer').value='';
    loadStageWords();
  }).catch(err => {
    fb.textContent = err.message; fb.className='feedback wrong';
  });
}

function loadStageWords(){
  const stageNum = document.getElementById('stageNum').value.trim();
  if(!stageNum) return;
  db.collection('stages').doc(stageNum).get().then(doc => {
    const list = (doc.exists && doc.data().words) ? doc.data().words : [];
    let rows = `<div class="eyebrow">Слова этапа ${stageNum} (${list.length})</div>`;
    list.forEach((w,i) => {
      rows += `<div class="wordrow"><span>${w.term}${w.term2?' / '+w.term2:''} → <b>${w.answer}</b></span>
        <button class="del" data-i="${i}">Удалить</button></div>`;
    });
    document.getElementById('stageWordList').innerHTML = rows;
    document.querySelectorAll('.del').forEach(btn => {
      btn.onclick = () => {
        const wordToRemove = list[parseInt(btn.dataset.i)];
        db.collection('stages').doc(stageNum).update({
          words: firebase.firestore.FieldValue.arrayRemove(wordToRemove)
        }).then(loadStageWords);
      };
    });
  });
}

auth.onAuthStateChanged(user => {
  clearInterval(timerInterval);
  if(user){
    if(user.email === ADMIN_EMAIL){
      renderAdmin();
    } else {
      loadStudentAndRenderHome(user.uid);
    }
  } else {
    studentData = null;
    renderAuth();
  }
});

signOutBtn.onclick = () => auth.signOut();
</script>
